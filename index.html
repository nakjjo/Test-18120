<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나는 어떤 아이스크림에 적합할까?</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f7f7f8;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            padding: 30px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* ================================================= */
        /* 📍 [로딩 화면 스타일]                              */
        /* ================================================= */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        /* 📍 [로딩 화면 사진 크기 & 스타일] */
        .loading-img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 24px;
        }

        /* 📍 [로딩 화면 글씨 스타일] */
        .loading-title {
            font-size: 20px;
            font-weight: 700;
            color: #222222;
            margin-bottom: 10px;
        }

        .loading-sub {
            font-size: 14px;
            color: #888888;
            margin-bottom: 30px;
        }

        /* 로딩 바 애니메이션 */
        .progress-bar-container {
            width: 200px;
            height: 6px;
            background-color: #f0f0f0;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background-color: #555555;
            animation: fillProgress 3s linear forwards;
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* ================================================= */
        /* 메인 콘텐츠 & 결과 화면                           */
        /* ================================================= */
        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #222222;
        }

        p {
            font-size: 15px;
            color: #666666;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 16px;
            background-color: #4a4a4a;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #333333;
        }

        .question-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #333333;
        }

        .option-btn {
            background-color: #f8f9fa;
            color: #333333;
            border: 1px solid #e9ecef;
            text-align: left;
        }

        .option-btn:hover {
            background-color: #f1f3f5;
        }

        .result-img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- 📍 1번 수정위치: [로딩 화면 HTML] -->
    <div id="loading-screen">
        <!-- 💡 로딩 화면에 넣을 이미지파일명 (48번째 줄 부근) -->
        <img src="icecream.png" alt="로딩 이미지" class="loading-img">
        
        <!-- 💡 로딩 화면에 넣을 글씨 (52, 53번째 줄 부근) -->
        <div class="loading-title">당신의 아이스크림을 쌓아 올리는 중...</div>
        <div class="loading-sub">잠시만 기다려주세요!</div>
        
        <div class="progress-bar-container">
            <div class="progress-bar-fill"></div>
        </div>
    </div>

    <div class="container">
        <!-- 시작 페이지 -->
        <div id="start-page" class="page active">
            <h1>나의 성격 유형 테스트</h1>
            <p> 간단한 5가지 질문을 통해 알아보는<br>나만의 성격 유형!</p>
            <button class="btn" onclick="startTest()">테스트 시작하기</button>
        </div>

        <!-- 질문 페이지 -->
        <div id="question-page" class="page">
            <div class="question-title" id="question-text">질문 내용</div>
            <div id="options-container"></div>
        </div>

        <!-- 결과 페이지 -->
        <div id="result-page" class="page">
            <h1 id="result-title">결과 타이틀</h1>
            <p id="result-desc">결과 설명이 들어갑니다.</p>
            <button class="btn" onclick="restartTest()">다시 테스트하기</button>
        </div>
    </div>

    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loadingScreen = document.getElementById('loading-screen');
                loadingScreen.style.opacity = '0';
                setTimeout(function() {
                    loadingScreen.style.display = 'none';
                }, 500); // 서서히 사라지는 효과시간 (0.5초)
            }, 3000); // 💡 3000 = 3초
        });

        // 테스트 데이터 및 로직
        const questions = [
            {
                q: "1. 주말에 석회동굴에 가게되었습니다. 이때 당신이 할 행동은?",
                a: [
                    { text: "어두운 동굴 깊은 곳에 무엇이 있는지 직접 끝까지 가봐야 직성이 풀린다.", type: "A" },
                    { text: "동굴에서 방문할 동선을 미리 계획한다.", type: "B" },
                    { text: "우선 같이 갈 일행을 구한 뒤, 무엇을 할지 맞춰본다.", type: "C" }
                ]
            },
            {
                q: "2. 동굴 안에서 어디에서도 보지 못한 특이한 돌을 발견했을때 당신은?",
                a: [
                    { text: "특이한 돌은 지나칠 수 없다! 돌을 관찰한다", type: "A" },
                    { text: "특이한 돌이 신기하지만 계획에 없던 일이다! 가볍게 눈으로 훑은 뒤 갈길을 간다.", type: "B" },
                    { text: "우선 돌을 관찰한 뒤, 일행에게 더 구경할 것인지 물어본다.", type: "C" }
                ]
            },
            {
                q: "3. 동굴 안에서 갈림길을 만났을때 당신은?",
                a: [
                    { text: "더 흥미로운 쪽으로 고른다.", type: "A" },
                    { text: "이미 갈림길에서 어디로 갈지 계획해놓아 결정할 필요가 없다.", type: "B" },
                    { text: "일행에게 의견을 물어 어디로 갈지 결정해본다.", type: "C" }
                ]
            },
            {
                q: "4. 동굴에서 일행이 다른 곳을 보러가자고 하지만 당신은 현재 있는 곳이 마음에 듭니다. 이때 당신은?",
                a: [
                    { text: "여기가 마음에 든다며 조금만 더 보고 가자고 말해본다.", type: "A" },
                    { text: "동굴의 경로를 확인하고 알겠다고 말한다.", type: "B" },
                    { text: "이 곳이 마음에 들지만 일행이 가고싶은 곳도 좋을 것 같다! 흔쾌히 수락한다.", type: "C" }
                ]
            },
            {
                q: "5. 석회동굴에서 딱 한 장의 사진만 남길 수 있다면?",
                a: [
                    { text: "오늘 관람하며 가장 마음에 들었던 돌을 고른다.", type: "A" },
                    { text: "이미 가장 마음에 드는 돌을 골라놓아 어디서 찍을지 쉽게 결정한다.", type: "B" },
                    { text: "하나의 특이한 돌 보다 여러개의 돌이 함께있는 곳을 결정한다.", type: "C" }
                ]
            }
        ];

        const results = {
            A: {
                title: "당신의 아이스크림은 초코맛 종유석",
                desc: "뾰족뾰족한 종유석과 같이 당신은 새로운 일에 망설임 없이 도전하는 편입니다. 호기심이 많고 과감하게 행동하는것에 거침없습니다.",
                img: "result1.png"
            },
            B: {
                title: "당신의 아이스크림은 흑임자맛 석순",
                desc: "동굴 바닥의 바위나 흙에서 차곡차곡 자라나는 석순처럼 당신은 신중하고 꾸준한 성격을 가진편입니다. 서두르기보다는 차근차근 해내가며 자신의 속도대로 목표를 달성합니다.",
                img: "result2.png"
            },
            C: {
                title: "당신의 아이스크림은 얼그레이맛 석주",
                desc: "위와 아래가 만나 하나의 기둥이 된 석주와 같이 당신은 균형과 조화를 중요하게 생각하는 편입니다. 자신의 의견을 소신있게 밀어가면서도 다른 사람의 의견 또한 존중하며 다양한 의견을 수용하려 노력합니다.",
                img: "result3.png"
            }
        };

        let currentQ = 0;
        let scores = { A: 0, B: 0, C: 0 };

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function startTest() {
            currentQ = 0;
            scores = { A: 0, B: 0, C: 0 };
            showPage('question-page');
            renderQuestion();
        }

        function renderQuestion() {
            const qData = questions[currentQ];
            document.getElementById('question-text').innerText = qData.q;
            
            const optionsBox = document.getElementById('options-container');
            optionsBox.innerHTML = '';

            qData.a.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(opt.type);
                optionsBox.appendChild(btn);
            });
        }

        function selectOption(type) {
            scores[type]++;
            currentQ++;

            if (currentQ < questions.length) {
                renderQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            let maxType = 'A';
            if (scores.B > scores[maxType]) maxType = 'B';
            if (scores.C > scores[maxType]) maxType = 'C';

            const res = results[maxType];
            document.getElementById('result-title').innerText = res.title;
            document.getElementById('result-desc').innerText = res.desc;
            document.getElementById('result-img').src = res.img;

            showPage('result-page');
        }

        function restartTest() {
            showPage('start-page');
        }
    </script>
</body>
</html>
